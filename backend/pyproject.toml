[tool.pytest.ini_options]
testpaths       = ["tests"]
asyncio_mode    = "auto"
log_cli         = true
log_cli_level   = "WARNING"
addopts         = "-v --tb=short"

[tool.ruff]
target-version  = "py311"
line-length     = 100
select          = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore          = ["E501"]

[tool.ruff.format]
quote-style     = "double"
indent-style    = "space"

[tool.mypy]
python_version  = "3.11"
strict          = false
ignore_missing_imports = true
